<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management — Video Admin</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="main-wrapper">
      <header class="topbar" id="app-topbar"></header>

      <main class="main-content">
        <!-- Page Header -->
        <div class="page-header">
          <div>
            <h1 class="page-header-title">User Management</h1>
            <p class="page-header-subtitle">Manage registered accounts, grant administrator roles, and toggle access status</p>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
          <div class="input-with-icon search-box">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </span>
            <input type="text" id="user-search-input" class="form-input" placeholder="Search by username or email...">
          </div>
        </div>

        <!-- Users Table -->
        <div class="table-container">
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th style="width: 100px;">User ID</th>
                  <th>Username</th>
                  <th>Email</th>
                  <th style="width: 110px;">Role</th>
                  <th style="width: 110px;">Status</th>
                  <th style="width: 160px;">Created At</th>
                  <th style="width: 100px;">Actions</th>
                </tr>
              </thead>
              <tbody id="users-table-body">
                <!-- Dynamically populated by js/users.js -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Edit User Modal -->
  <div class="modal-backdrop" id="user-edit-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">Edit User Privileges</h3>
        <button class="modal-close" type="button" onclick="window.UI.closeModal('user-edit-modal')">&times;</button>
      </div>
      <form id="user-edit-form">
        <div class="modal-body">
          <div class="mb-4 p-3 bg-secondary" style="background-color: var(--color-bg-secondary); border-radius: var(--radius-md);">
            <div class="text-sm font-semibold" id="edit-user-username">—</div>
            <div class="text-xs text-muted" id="edit-user-email">—</div>
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-user-role">
              <span>Account Role</span>
            </label>
            <select id="edit-user-role" class="form-select">
              <option value="USER">USER (Standard Account)</option>
              <option value="ADMIN">ADMIN (Full System Privileges)</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="edit-user-status">
              <span>Account Status</span>
            </label>
            <select id="edit-user-status" class="form-select">
              <option value="ACTIVE">ACTIVE (Can log in)</option>
              <option value="INACTIVE">INACTIVE (Access blocked)</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="window.UI.closeModal('user-edit-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-user">Update Privileges</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/users.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const authData = await window.Guard.requireAuth({ requireAdmin: true });
      if (!authData) return;

      window.Layout.init('users');
      await window.Users.init();
    });
  </script>
</body>
</html>
