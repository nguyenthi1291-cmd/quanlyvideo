<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Video Admin</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-brand-logo">V</div>
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Enter your registered email and we'll send you a password reset link</p>
      </div>

      <form id="forgot-form" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="forgot-email">
            <span>Email address</span>
            <span class="required">*</span>
          </label>
          <input type="email" id="forgot-email" class="form-input" placeholder="name@domain.com" required autocomplete="email">
        </div>

        <button type="submit" id="btn-forgot-submit" class="btn btn-primary btn-full mt-2">
          Send Reset Link
        </button>
      </form>

      <div class="auth-footer">
        Remember your password? <a href="login.html" class="auth-link">Return to login</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgot-form');
      const submitBtn = document.getElementById('btn-forgot-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('forgot-email').value.trim();
        if (!email) {
          window.UI.toast('Please enter your email address.', 'warning');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<div class="spinner spinner-sm"></div> Sending...`;

        try {
          await window.Auth.forgotPassword(email);
          window.UI.toast('Password reset link sent! Check your email inbox.', 'success', 'Email Sent', 6000);
          form.reset();
        } catch (err) {
          console.error("Forgot password error:", err);
          window.UI.toast(err.message || 'Failed to send reset link.', 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send Reset Link';
        }
      });
    });
  </script>
</body>
</html>
