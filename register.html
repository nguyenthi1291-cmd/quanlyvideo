<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account — Video Admin</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-brand-logo">V</div>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join Video Admin Management system</p>
      </div>

      <form id="register-form" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="reg-username">
            <span>Username</span>
            <span class="required">*</span>
          </label>
          <input type="text" id="reg-username" class="form-input" placeholder="e.g. johndoe" required autocomplete="username">
          <span class="form-hint">At least 3 characters, alphanumeric & underscore</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">
            <span>Email address</span>
            <span class="required">*</span>
          </label>
          <input type="email" id="reg-email" class="form-input" placeholder="name@domain.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">
            <span>Password</span>
            <span class="required">*</span>
          </label>
          <input type="password" id="reg-password" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm-password">
            <span>Confirm Password</span>
            <span class="required">*</span>
          </label>
          <input type="password" id="reg-confirm-password" class="form-input" placeholder="••••••••" required autocomplete="new-password">
        </div>

        <button type="submit" id="btn-reg-submit" class="btn btn-primary btn-full mt-2">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html" class="auth-link">Sign in here</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/guard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await window.Guard.redirectIfLoggedIn();

      const form = document.getElementById('register-form');
      const submitBtn = document.getElementById('btn-reg-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('reg-username').value.trim();
        const email = document.getElementById('reg-email').value.trim();
        const password = document.getElementById('reg-password').value;
        const confirmPassword = document.getElementById('reg-confirm-password').value;

        // Validation
        if (!username || username.length < 3) {
          window.UI.toast('Username must be at least 3 characters.', 'warning');
          return;
        }

        if (!email || !email.includes('@')) {
          window.UI.toast('Please enter a valid email address.', 'warning');
          return;
        }

        if (!password || password.length < 6) {
          window.UI.toast('Password must be at least 6 characters.', 'warning');
          return;
        }

        if (password !== confirmPassword) {
          window.UI.toast('Passwords do not match.', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<div class="spinner spinner-sm"></div> Creating account...`;

        try {
          const { user, session } = await window.Auth.register(username, email, password);

          if (session) {
            window.UI.toast('Registration successful! Redirecting to dashboard...', 'success');
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 1000);
          } else {
            // Email confirmation required or user created without session
            window.UI.toast('Account created successfully! If email confirmation is enabled on Supabase, please confirm your email or sign in.', 'success', 'Account Created', 6000);
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 2000);
          }
        } catch (err) {
          console.error("Registration error:", err);
          window.UI.toast(err.message || 'Failed to create account.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }
      });
    });
  </script>
</body>
</html>
