<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — Video Admin</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="main-wrapper">
      <header class="topbar" id="app-topbar"></header>

      <main class="main-content">
        <!-- Page Header -->
        <div class="page-header">
          <div>
            <h1 class="page-header-title">Categories</h1>
            <p class="page-header-subtitle">Organize and classify video content taxonomies</p>
          </div>
          <div class="page-header-actions">
            <button class="btn btn-primary" onclick="window.Categories.openCreateModal()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              Add Category
            </button>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
          <div class="input-with-icon search-box">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </span>
            <input type="text" id="category-search-input" class="form-input" placeholder="Search categories...">
          </div>
        </div>

        <!-- Categories Table -->
        <div class="table-container">
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th style="width: 60px;">ID</th>
                  <th style="width: 200px;">Name & Slug</th>
                  <th>Description</th>
                  <th style="width: 140px;">Usage</th>
                  <th style="width: 110px;">Status</th>
                  <th style="width: 120px;">Actions</th>
                </tr>
              </thead>
              <tbody id="categories-table-body">
                <!-- Dynamically populated by js/categories.js -->
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Category Modal (Add / Edit) -->
  <div class="modal-backdrop" id="category-form-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="category-modal-title">Add Category</h3>
        <button class="modal-close" type="button" onclick="window.UI.closeModal('category-form-modal')">&times;</button>
      </div>
      <form id="category-form">
        <div class="modal-body">
          <div class="form-group">
            <label class="form-label" for="category-name">
              <span>Category Name</span>
              <span class="required">*</span>
            </label>
            <input type="text" id="category-name" class="form-input" placeholder="e.g. Technology" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="category-slug">
              <span>Slug</span>
              <span class="text-xs text-muted">Auto-generated</span>
            </label>
            <input type="text" id="category-slug" class="form-input font-mono" placeholder="technology">
          </div>

          <div class="form-group">
            <label class="form-label" for="category-description">
              <span>Description</span>
            </label>
            <textarea id="category-description" class="form-textarea" rows="3" placeholder="Category purpose or topic..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label" for="category-status">
              <span>Status</span>
            </label>
            <select id="category-status" class="form-select">
              <option value="ACTIVE">Active</option>
              <option value="INACTIVE">Inactive</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="window.UI.closeModal('category-form-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-category">Save Category</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/categories.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const authData = await window.Guard.requireAuth();
      if (!authData) return;

      window.Layout.init('categories');
      await window.Categories.init();
    });
  </script>
</body>
</html>
