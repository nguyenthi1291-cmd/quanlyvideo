<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Video Admin</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-brand-logo">V</div>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to your Video Admin Management workspace</p>
      </div>

      <form id="login-form" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="login-email">
            <span>Email address</span>
            <span class="required">*</span>
          </label>
          <input type="email" id="login-email" class="form-input" placeholder="admin1@gmail.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <div class="flex items-center justify-between mb-1">
            <label class="form-label" for="login-password" style="margin-bottom:0;">
              <span>Password</span>
              <span class="required">*</span>
            </label>
            <a href="forgot-password.html" class="auth-link text-xs">Forgot password?</a>
          </div>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="btn-login-submit" class="btn btn-primary btn-full mt-2">
          Sign In
        </button>
      </form>

      <div class="auth-demo-box">
        <strong>Demo Development Accounts:</strong>
        <div class="mt-1 flex items-center justify-between">
          <span>Admin: <span class="auth-demo-badge">admin1@gmail.com</span></span>
          <span class="text-muted">Pass: 123456</span>
        </div>
        <div class="mt-1 flex items-center justify-between">
          <span>User: <span class="auth-demo-badge">user1@gmail.com</span></span>
          <span class="text-muted">Pass: 123456</span>
        </div>
      </div>

      <div class="auth-footer">
        Don't have an account? <a href="register.html" class="auth-link">Register now</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/guard.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await window.Guard.redirectIfLoggedIn();

      const form = document.getElementById('login-form');
      const submitBtn = document.getElementById('btn-login-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        if (!email || !password) {
          window.UI.toast('Please provide both email and password.', 'warning');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<div class="spinner spinner-sm"></div> Signing in...`;

        try {
          const { user } = await window.Auth.login(email, password);
          window.UI.toast('Welcome back! Loading your dashboard...', 'success');

          // Redirect to target or dashboard
          const redirectUrl = sessionStorage.getItem('auth_redirect') || 'dashboard.html';
          sessionStorage.removeItem('auth_redirect');

          setTimeout(() => {
            window.location.href = redirectUrl;
          }, 600);
        } catch (err) {
          console.error("Login failed:", err);
          let errorMsg = err.message || 'Invalid email or password.';
          if (errorMsg.toLowerCase().includes('email not confirmed')) {
            errorMsg = 'Email chưa được xác nhận. Vui lòng xác nhận email hoặc chạy lệnh auto-confirm trên Supabase SQL Editor.';
          }
          window.UI.toast(errorMsg, 'error', 'Login Error', 6000);
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>
