<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password — Video Admin</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-brand-logo">V</div>
        <h1 class="auth-title">Set New Password</h1>
        <p class="auth-subtitle">Choose a new secure password for your account</p>
      </div>

      <form id="reset-form" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="new-password">
            <span>New Password</span>
            <span class="required">*</span>
          </label>
          <input type="password" id="new-password" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm-password">
            <span>Confirm New Password</span>
            <span class="required">*</span>
          </label>
          <input type="password" id="confirm-password" class="form-input" placeholder="••••••••" required autocomplete="new-password">
        </div>

        <button type="submit" id="btn-reset-submit" class="btn btn-primary btn-full mt-2">
          Update Password
        </button>
      </form>

      <div class="auth-footer">
        <a href="login.html" class="auth-link">Return to login</a>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('reset-form');
      const submitBtn = document.getElementById('btn-reset-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const newPassword = document.getElementById('new-password').value;
        const confirmPassword = document.getElementById('confirm-password').value;

        if (!newPassword || newPassword.length < 6) {
          window.UI.toast('Password must be at least 6 characters.', 'warning');
          return;
        }

        if (newPassword !== confirmPassword) {
          window.UI.toast('Passwords do not match.', 'error');
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<div class="spinner spinner-sm"></div> Updating...`;

        try {
          await window.Auth.resetPassword(newPassword);
          window.UI.toast('Password updated successfully! Redirecting to login...', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 1500);
        } catch (err) {
          console.error("Reset password error:", err);
          window.UI.toast(err.message || 'Failed to update password.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
        }
      });
    });
  </script>
</body>
</html>
