<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Library — Video Admin</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="main-wrapper">
      <header class="topbar" id="app-topbar"></header>

      <main class="main-content">
        <!-- Page Header -->
        <div class="page-header">
          <div>
            <h1 class="page-header-title">Video Library</h1>
            <p class="page-header-subtitle">Manage, stream preview, and edit published video media</p>
          </div>
          <div class="page-header-actions">
            <a href="video-form.html" class="btn btn-primary">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
              Upload Video
            </a>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
          <div class="filter-group">
            <!-- Search Box -->
            <div class="input-with-icon search-box">
              <span class="input-icon">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
              </span>
              <input type="text" id="video-search-input" class="form-input" placeholder="Search by video title...">
            </div>

            <!-- Category Filter -->
            <select id="video-category-filter" class="form-select" style="width: auto; min-width: 160px;">
              <option value="">All Categories</option>
            </select>

            <!-- Status Filter -->
            <select id="video-status-filter" class="form-select" style="width: auto; min-width: 140px;">
              <option value="">All Statuses</option>
              <option value="ACTIVE">Active</option>
              <option value="INACTIVE">Inactive</option>
              <option value="DRAFT">Draft</option>
            </select>
          </div>

          <div class="filter-group">
            <!-- Sort Filter -->
            <select id="video-sort-filter" class="form-select" style="width: auto; min-width: 180px;">
              <option value="created_at_desc">Newest First</option>
              <option value="created_at_asc">Oldest First</option>
              <option value="views_desc">Most Viewed</option>
              <option value="views_asc">Least Viewed</option>
              <option value="title_asc">Title (A-Z)</option>
            </select>
          </div>
        </div>

        <!-- Video Table Container -->
        <div class="table-container" id="videos-table-container">
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th style="width: 60px;">ID</th>
                  <th style="width: 100px;">Thumbnail</th>
                  <th>Title & Description</th>
                  <th style="width: 110px;">Views</th>
                  <th style="width: 140px;">Category</th>
                  <th style="width: 110px;">Status</th>
                  <th style="width: 120px;">Created At</th>
                  <th style="width: 120px;">Actions</th>
                </tr>
              </thead>
              <tbody id="videos-table-body">
                <!-- Dynamic rows rendered by js/videos.js -->
              </tbody>
            </table>
          </div>
          <!-- Pagination -->
          <div class="pagination" id="videos-pagination"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/videos.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const authData = await window.Guard.requireAuth();
      if (!authData) return;

      window.Layout.init('videos');
      await window.Videos.init();
    });
  </script>
</body>
</html>
