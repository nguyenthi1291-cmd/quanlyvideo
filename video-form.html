<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Editor — Video Admin</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="app-sidebar"></aside>

    <div class="main-wrapper">
      <header class="topbar" id="app-topbar"></header>

      <main class="main-content">
        <!-- Page Header -->
        <div class="page-header">
          <div>
            <h1 class="page-header-title" id="form-page-title">Add New Video</h1>
            <p class="page-header-subtitle">Upload video media and configure presentation metadata</p>
          </div>
          <div>
            <a href="videos.html" class="btn btn-outline btn-sm">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
              Back to Library
            </a>
          </div>
        </div>

        <form id="video-form" class="card" style="max-width: 900px;" novalidate>
          <div class="form-group">
            <label class="form-label" for="video-title">
              <span>Video Title</span>
              <span class="required">*</span>
            </label>
            <input type="text" id="video-title" class="form-input" placeholder="e.g. Masterclass on Web Performance" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="video-slug">
              <span>URL Slug</span>
              <span class="text-xs text-muted">Auto-generated</span>
            </label>
            <input type="text" id="video-slug" class="form-input font-mono" placeholder="masterclass-on-web-performance">
          </div>

          <div class="form-group">
            <label class="form-label" for="video-category">
              <span>Category</span>
              <span class="required">*</span>
            </label>
            <select id="video-category" class="form-select" required>
              <option value="">Loading categories...</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="video-description">
              <span>Description</span>
            </label>
            <textarea id="video-description" class="form-textarea" rows="4" placeholder="Brief summary of video content..."></textarea>
          </div>

          <!-- Video File Upload Section -->
          <div class="form-group">
            <label class="form-label">
              <span>Video File</span>
              <span class="text-xs text-muted">Max 200MB (MP4, WebM, QuickTime)</span>
            </label>
            <div class="upload-dropzone" id="video-dropzone">
              <input type="file" id="video-file-input" accept="video/mp4,video/webm,video/quicktime,video/x-matroska">
              <div class="upload-icon">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              </div>
              <p class="font-medium text-sm">Click or drag & drop video file here</p>
              <p class="text-xs text-muted mt-1">Direct upload to Supabase Storage</p>
            </div>
            <div id="video-file-info"></div>
          </div>

          <!-- Thumbnail Upload Section -->
          <div class="form-group">
            <label class="form-label">
              <span>Video Thumbnail</span>
              <span class="text-xs text-muted">Max 10MB (JPEG, PNG, WebP)</span>
            </label>
            <div class="upload-dropzone" id="thumb-dropzone">
              <input type="file" id="thumbnail-file-input" accept="image/jpeg,image/png,image/webp,image/gif">
              <div class="upload-icon">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
              </div>
              <p class="font-medium text-sm">Click or drag & drop thumbnail image</p>
            </div>
            <div class="mt-3">
              <img id="thumb-preview-img" src="" alt="Thumbnail preview" class="hidden" style="width: 160px; height: 95px; object-fit: cover; border-radius: var(--radius-md); border: 1px solid var(--color-border);" />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="video-status">
              <span>Publication Status</span>
            </label>
            <select id="video-status" class="form-select">
              <option value="ACTIVE">Active (Published)</option>
              <option value="DRAFT">Draft (Unlisted)</option>
              <option value="INACTIVE">Inactive (Archived)</option>
            </select>
          </div>

          <!-- Upload Progress Indicator -->
          <div id="upload-progress-container" class="hidden mt-4">
            <div class="flex items-center justify-between text-xs text-secondary mb-1">
              <span>Uploading assets to Supabase Storage...</span>
            </div>
            <div class="progress-bar-container">
              <div class="progress-bar-fill" id="upload-progress-fill"></div>
            </div>
          </div>

          <!-- Form Actions -->
          <div class="flex items-center justify-end gap-3 mt-6 pt-4" style="border-top: 1px solid var(--color-border);">
            <a href="videos.html" class="btn btn-secondary">Cancel</a>
            <button type="submit" id="btn-submit-video" class="btn btn-primary">
              <span id="btn-submit-text">Create Video</span>
            </button>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/guard.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/video-form.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const authData = await window.Guard.requireAuth({ requireAdmin: true });
      if (!authData) return;

      window.Layout.init('video-form');
      await window.VideoForm.init();
    });
  </script>
</body>
</html>
